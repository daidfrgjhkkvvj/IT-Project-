<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Management System</h1>
        <p>A simple JavaScript project for an IT practical</p>
    </header>

    <main>
        <!-- form section -->
        <section class="card">
            <h2>Add Student</h2>

            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="e.g. John">
            </div>

            <div class="field">
                <label for="matricNo">Matric Number</label>
                <input type="text" id="matricNo" placeholder="e.g. CSC/2023/001">
            </div>

            <div class="field">
                <label for="level">Level</label>
                <input type="number" id="level" placeholder="e.g. 300">
            </div>

            <div class="field">
                <label for="department">Department</label>
                <input type="text" id="department" placeholder="e.g. Computer Science">
            </div>

            <div class="buttons">
                <button id="addBtn" class="btn primary">Add Student</button>
                <button id="removeBtn" class="btn danger">Remove Last</button>
            </div>

            <p id="message"></p>
        </section>

        <!-- list section -->
        <section class="card">
            <h2>Students <span id="count">0</span></h2>

            <p id="emptyText">No students have been added yet.</p>

            <div class="table-wrap">
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Matric No</th>
                            <th>Level</th>
                            <th>Department</th>
                        </tr>
                    </thead>
                    <tbody id="studentList"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
